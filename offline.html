<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#6d28d9" />
  <title>TSO Betaalverzoeken — Geen verbinding</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7fb;
      color: #1f2937;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
    }
    main {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 32px 28px;
      max-width: 360px;
      margin: 16px;
      text-align: center;
    }
    img { width: 64px; height: 64px; border-radius: 14px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #6b7280; margin: 0 0 20px; line-height: 1.5; }
    button {
      background: #6d28d9;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #5b21b6; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="" />
    <h1>Geen verbinding</h1>
    <p>De gegevens staan online en worden niet op dit apparaat bewaard. Maak verbinding met internet en probeer het opnieuw.</p>
    <button type="button" id="opnieuw">Opnieuw proberen</button>
  </main>
  <script>
    document.getElementById('opnieuw').addEventListener('click', () => location.reload());
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
